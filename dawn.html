            pointer-events: none;

        #character-sprite.hang-crop {

        }

        #interface-layer {

    let internalHopeScore = 0;
    let currentStep = 'start';

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
    }

    function playTextBeep() {
        if (!audioCtx) return;
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(115, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.012, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.035);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.035);
    }

    function playSnapSound() {
        if (!audioCtx) return;
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(750, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(180, audioCtx.currentTime + 0.09);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.09);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.09);
    }

    function playSnowStep() {
        if (!audioCtx) return;
        let bufferSize = audioCtx.sampleRate * 0.16;
        let buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        let data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
        }
        let noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        let filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.value = 320;
        filter.Q.value = 1.6;
        let gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.16);
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        noise.start();
    }

    function playHitSound() {
        if (!audioCtx) return;
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(90, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.12);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.12);
    }

    function playKnockSound() {
        if (!audioCtx) return;
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(140, audioCtx.currentTime);
        osc.frequency.setValueAtTime(70, audioCtx.currentTime + 0.05);
        gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.15);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.15);
    }

    function startTVHum() {
        if (!audioCtx || activeHumGain) return;
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(60, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        activeHumGain = gain;
    }

    function stopTVHum() {
        if (activeHumGain) {
            try { activeHumGain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.3); } catch(e){}
            activeHumGain = null;
        }
    }

    function typeWriter(text, i, fnCallback) {
        if (i < text.length) {
            document.getElementById("text-box").innerHTML = text.substring(0, i+1) + '<span aria-hidden="true"></span>';
            playTextBeep();
            setTimeout(function() {
                typeWriter(text, i + 1, fnCallback)
            }, 30);
        } else if (typeof fnCallback == 'function') {
            setTimeout(fnCallback, 400);
        }
    }

    function changeImage(sceneSrc, charSrc, shouldZoom) {
        const sceneImg = document.getElementById("scene-background");
        const charImg = document.getElementById("character-sprite");
        
        if (shouldZoom) {
            charImg.classList.add("hang-crop");
        } else {
            charImg.classList.remove("hang-crop");
        }
        
       
        sceneImg.src = sceneSrc;
        charImg.src = charSrc;
        
        sceneImg.style.opacity = 1;
        charImg.style.opacity = 1;
    }

    function runCreditsSequence(endingType) {
        const viewport = document.getElementById("fullscreen-viewport");
        const creditsScreen = document.getElementById("credits-screen");

        viewport.style.opacity = 0;
        setTimeout(() => {
            viewport.style.display = "none";
            creditsScreen.style.opacity = 1;
            creditsScreen.style.pointerEvents = "auto";
            
            let engLine = "";
            let japLine = "";

            if (endingType === "ending_tragedy_hang") {
                engLine = "The dawn that will never come.";
                japLine = "決して訪れない夜明け。";
            } else if (endingType === "ending_tragedy_pills") {
                engLine = "The dawn you will regret.";
                japLine = "後悔する夜明け。";
            } else if (endingType === "ending_tragedy_hunger") {
                engLine = "The dawn that suffocates.";
                japLine = "息苦しい夜明け。";
            } else if (endingType === "ending_hope_alone") {
                engLine = "The dawn that calms me.";
                japLine = "私を落ち着かせる夜明け。";
            } else if (endingType === "ending_hope_saigo") {
                engLine = "The dawn that will last forever.";
                japLine = "永遠に続く夜明け。";
            }
            
            showCreditsLine(engLine, 2500, () => {
                showCreditsLine(japLine, 2500, () => {
                    showCreditsLine("Author: lookoooooooo\n\nThank you for playing!", 4000, () => {
                        setTimeout(() => {
                            localStorage.removeItem('dawn_saved_step');
                            localStorage.removeItem('dawn_saved_hope');
                            localStorage.removeItem('dawn_saved_clip');
                            internalHopeScore = 0;
                            stopTVHum();
                            document.getElementById("main-menu").style.display = "flex";
                            document.getElementById("main-menu").style.opacity = 1;
                            creditsScreen.style.opacity = 0;
                            creditsScreen.style.pointerEvents = "none";
                        }, 1000);
                    });
                });
            });
        }, 1000);
    }

    function showCreditsLine(lineText, duration, onComplete) {
        const creditsText = document.getElementById("credits-text");
        creditsText.style.opacity = 0;
        setTimeout(() => {
            creditsText.innerText = lineText;
            creditsText.style.opacity = 1;
            setTimeout(() => {
                creditsText.style.opacity = 0;
                setTimeout(onComplete, 1000);
            }, duration);
        }, 500);
    }

    function handleSoundTrigger(soundType) {
        if (!soundType) {
            stopTVHum();
            return;
        }
        initAudio();
        if (soundType === "snap") {
            stopTVHum();
            playSnapSound();
        } else if (soundType === "snow") {
            stopTVHum();
            let count = 0;
            let interval = setInterval(() => {
                playSnowStep();
                count++;
                if (count >= 3) clearInterval(interval);
            }, 400);
        } else if (soundType === "hit") {
            stopTVHum();
            playHitSound();
        } else if (soundType === "knock") {
            stopTVHum();
            playKnockSound();
        } else if (soundType === "tvhum") {
            startTVHum();
        }
    }

    function startGame() {
        initAudio();
        document.getElementById("main-menu").style.opacity = 0;
        setTimeout(() => {
            document.getElementById("main-menu").style.display = "none";
            const vp = document.getElementById("fullscreen-viewport");
            vp.style.display = "flex";
            setTimeout(() => { vp.style.opacity = 1; }, 50);
            internalHopeScore = 0;
            hasClip = true;
            currentStep = 'start';
            renderStep(currentStep);
        }, 600);
    }

    function stopToMenu() {
        stopTVHum();
        document.getElementById("fullscreen-viewport").style.opacity = 0;
        setTimeout(() => {
            document.getElementById("fullscreen-viewport").style.display = "none";
            const mm = document.getElementById("main-menu");
            mm.style.display = "flex";
            setTimeout(() => { mm.style.opacity = 1; checkSaveState(); }, 50);
        }, 600);
    }

    function saveGame() {
        localStorage.setItem('dawn_saved_step', currentStep);
        localStorage.setItem('dawn_saved_hope', internalHopeScore);
        localStorage.setItem('dawn_saved_clip', hasClip ? "1" : "0");
        alert("Scene saved successfully.");
    }

    function loadGame() {
        const savedStep = localStorage.getItem('dawn_saved_step');
        const savedHope = localStorage.getItem('dawn_saved_hope');
        const savedClip = localStorage.getItem('dawn_saved_clip');
        if (savedStep) {
            initAudio();
            document.getElementById("main-menu").style.opacity = 0;
            setTimeout(() => {
                document.getElementById("main-menu").style.display = "none";
                const vp = document.getElementById("fullscreen-viewport");
                vp.style.display = "flex";
                setTimeout(() => { vp.style.opacity = 1; }, 50);
                internalHopeScore = parseInt(savedHope) || 0;
                hasClip = savedClip === "1";
                currentStep = savedStep;
                renderStep(currentStep);
            }, 600);
        }
    }

    function checkSaveState() {
        const savedStep = localStorage.getItem('dawn_saved_step');
        const loadBtn = document.getElementById("load-btn");
        if (!savedStep) {
            loadBtn.style.opacity = "0.4";
            loadBtn.style.pointerEvents = "none";
        } else {
            loadBtn.style.opacity = "1";
            loadBtn.style.pointerEvents = "auto";
        }
    }

    function renderStep(stepKey) {
        currentStep = stepKey;
        
        if (stepKey === "eval_school_bullying") {
            stepKey = hasClip ? "school_bully_clip" : "school_bully_no_clip";
            currentStep = stepKey;
        }

        if (stepKey === "eval_ending") {
            if (internalHopeScore <= -4) {
                stepKey = "ending_tragedy_hang";
            } else if (internalHopeScore < 0) {
                stepKey = "ending_tragedy_pills";
            } else if (internalHopeScore <= 2) {
                stepKey = "ending_tragedy_hunger";
            } else if (internalHopeScore <= 4) {
                stepKey = "ending_hope_alone";
            } else {
                stepKey = "ending_hope_saigo";
            }
            currentStep = stepKey;
        }
        
        if (stepKey === "TRIGGER_CREDITS") {
            runCreditsSequence(currentStep);
            return;
        }

        const step = story[stepKey];
        if (step.action) step.action();

        document.getElementById("speaker-tag").innerText = step.speaker;
        
     
        const endingTag = document.getElementById("ending-tag");
        if (step.endingNum) {
            endingTag.innerText = "Ending " + step.endingNum;
            endingTag.style.display = "block";
        } else {
            endingTag.style.display = "none";
        }

        const choicesContainer = document.getElementById("choices");
        choicesContainer.innerHTML = ""; 
        
        changeImage(step.image, step.character, step.zoom || false);
        handleSoundTrigger(step.sound);
        
        typeWriter(step.text, 0, function() {
            step.choices.forEach(choice => {
                const button = document.createElement("button");
                button.className = "btn-choice";
                button.innerText = choice.text;
                button.onclick = () => {
                    initAudio();
                    internalHopeScore += choice.hope;
                    renderStep(choice.next);
                };
                choicesContainer.appendChild(button);
            });
        });
    }

    window.onload = checkSaveState;
</script>
</body>
</html>
