<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Dawn We Missed</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(180deg, #141624 0%, #282a3a 50%, #4a4154 100%);
            color: #d1d2dd;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        #game-container {
            width: 85%;
            max-width: 650px;
            background: rgba(15, 16, 26, 0.85);
            padding: 35px;
            border-radius: 6px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        #text-box {
            font-size: 1.05rem;
            line-height: 1.7;
            min-height: 140px;
            margin-bottom: 35px;
            color: #e2e4f0;
        }

        .choices-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .btn-choice {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #b9bad1;
            padding: 14px;
            border-radius: 4px;
            cursor: pointer;
            text-align: left;
            font-family: inherit;
            font-size: 0.95rem;
            transition: all 0.4s ease;
        }

        .btn-choice:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            border-color: #928ca3;
            padding-left: 22px;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="text-box"></div>
    <div class="choices-container" id="choices"></div>
</div>

<script>
    let internalHopeScore = 0;

    const story = {
        start: {
            text: "4:32 AM. The Yamanote line hasn't started yet, but the air outside feels static, almost frozen. Your phone screen blinks in the dark. Nobody called. Do you get up?",
            choices: [
                { text: "Take a long, slow breath. Get out of bed.", next: "room_look", hope: 1 },
                { text: "Ignore it. Let the cold room swallow you.", next: "stay_in_bed", hope: 0 }
            ]
        },
        stay_in_bed: {
            text: "The ceiling pattern becomes your entire world. Outside, you hear the distant, repetitive chirp of a Japanese pedestrian traffic light. It sounds incredibly lonely. Time loses its meaning.",
            choices: [
                { text: "Force your numb feet onto the cold floor.", next: "room_look", hope: 0 }
            ]
        },
        room_look: {
            text: "Your school uniform hangs by the window, looking like a silhouette of someone you used to know. The faint smell of old tatami and dust fills the silence. Your school bag lies empty on the desk.",
            choices: [
                { text: "Pack your books. Put on the mask.", next: "train_station", hope: 0 },
                { text: "Stare at a small, dried flower on your shelf.", next: "flower_stare", hope: 1 }
            ]
        },
        flower_stare: {
            text: "It's a forgotten souvenir from a brief summer day when you laughed. Your chest aches slightly, but it's a real feeling, not just emptiness.",
            choices: [
                { text: "Put it back gently and head to the station.", next: "train_station", hope: 0 }
            ]
        },
        train_station: {
            text: "The platform is covered in a thick morning fog. Students in identical uniforms stand like ghosts. The warning chime rings out—a melancholy melody signaling the arrival of the train. You stand right near the yellow line.",
            choices: [
                { text: "Step forward into the crowded car. Accept the routine.", next: "school_routine", hope: 0 },
                { text: "Look up at the sky. Notice a tiny patch of blue breaking through.", next: "sky_notice", hope: 1 }
            ]
        },
        sky_notice: {
            text: "The clouds are heavy, but they are moving. The wind feels cold against your face, reminding you that you are still here, still breathing.",
            choices: [
                { text: "Board the train with a slight sigh.", next: "school_routine", hope: 0 }
            ]
        },
        school_routine: {
            text: "Hours blur together. The teacher's voice sounds like it's drifting from underwater. During the break, you sit alone at your desk, tracing the wooden grain. Nobody looks your way. It feels like you are becoming transparent.",
            choices: [
                { text: "Go to the rooftop during the final sunset.", next: "rooftop_climax", hope: 0 }
            ]
        },
        rooftop_climax: {
            text: "The sky over Tokyo is bleeding a deep, industrial orange. The wind up here is violent, pulling at your hair. You look down at the tiny, distant world below. Everything feels completely out of reach. This is the edge.",
            choices: [
                { text: "Check your phone one last time.", next: "eval_ending", hope: 0 }
            ]
        },
        ending_tragedy: {
            text: "The screen is blank. The silence is absolute. The orange horizon fades into total darkness as you let go.",
            choices: [
                { text: "Restart the cycle.", next: "reset_game", hope: 0 }
            ]
        },
        ending_hope: {
            text: "Suddenly, a soft chime echoes. An old notification pops up from a distant friend across the ocean: 'Hey, I know it's early over there, but I saw something that reminded me of you. Are you awake?' Your fingers tremble. The sunrise slowly breaks over the skyline.",
            choices: [
                { text: "Type a reply. Stay.", next: "reset_game", hope: 0 }
            ]
        }
    };

    function typeWriter(text, i, fnCallback) {
        if (i < text.length) {
            document.getElementById("text-box").innerHTML = text.substring(0, i+1) + '<span aria-hidden="true"></span>';
            setTimeout(function() {
                typeWriter(text, i + 1, fnCallback)
            }, 25);
        } else if (typeof fnCallback == 'function') {
            setTimeout(fnCallback, 400);
        }
    }

    function renderStep(stepKey) {
        if (stepKey === "eval_ending") {
            stepKey = (internalHopeScore >= 2) ? "ending_hope" : "ending_tragedy";
        }
        
        if (stepKey === "reset_game") {
            internalHopeScore = 0;
            stepKey = "start";
        }

        const step = story[stepKey];
        const choicesContainer = document.getElementById("choices");
        choicesContainer.innerHTML = ""; 
        
        typeWriter(step.text, 0, function() {
            step.choices.forEach(choice => {
                const button = document.createElement("button");
                button.className = "btn-choice";
                button.innerText = choice.text;
                button.onclick = () => {
                    internalHopeScore += choice.hope;
                    renderStep(choice.next);
                };
                choicesContainer.appendChild(button);
            });
        });
    }

    /* ゲームの開始 */
    renderStep('start');
</script>

</body>
</html>
